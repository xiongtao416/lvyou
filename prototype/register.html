<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>活动报名 - 户外活动报名</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F5F5F5;
      min-height: 100vh;
      padding-bottom: 80px;
    }
    .page-container {
      max-width: 375px;
      margin: 0 auto;
      background: #F5F5F5;
    }
    
    /* 导航栏 */
    .nav-bar {
      background: #fff;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid #f0f0f0;
    }
    .nav-back {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .nav-back svg { width: 20px; height: 20px; color: #333; }
    .nav-title { font-size: 17px; font-weight: 600; color: #333; }
    .nav-right { width: 32px; }
    
    /* 活动摘要卡片 */
    .activity-summary {
      background: #fff;
      margin: 12px;
      padding: 12px;
      border-radius: 10px;
      display: flex;
      gap: 12px;
    }
    .activity-summary img {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      object-fit: cover;
    }
    .activity-info { flex: 1; }
    .activity-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .activity-meta {
      font-size: 12px;
      color: #999;
      line-height: 1.6;
    }
    .activity-price {
      font-size: 16px;
      font-weight: 600;
      color: #FF6B00;
      margin-top: 4px;
    }
    
    /* 表单区域 */
    .form-section {
      background: #fff;
      margin: 12px;
      border-radius: 10px;
      padding: 16px;
    }
    .form-title {
      font-size: 15px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f0f0f0;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      font-size: 14px;
      color: #333;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .form-label .required { color: #FF4757; }
    .form-input {
      width: 100%;
      height: 44px;
      background: #F8F8F8;
      border: 1px solid #E8E8E8;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      color: #333;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-color: #FFD000;
      background: #fff;
    }
    .form-input::placeholder { color: #bbb; }
    .form-textarea {
      height: 80px;
      padding: 12px;
      resize: none;
    }
    
    /* 出发方式 */
    .transport-options {
      display: flex;
      gap: 10px;
    }
    .transport-option {
      flex: 1;
      height: 44px;
      background: #F8F8F8;
      border: 1px solid #E8E8E8;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
    }
    .transport-option.active {
      background: #FFF9E6;
      border-color: #FFD000;
      color: #333;
    }
    .transport-option svg { width: 18px; height: 18px; }
    
    /* 人数选择 */
    .count-selector {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .count-btn {
      width: 36px;
      height: 36px;
      background: #F8F8F8;
      border: 1px solid #E8E8E8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      color: #666;
      transition: all 0.2s;
    }
    .count-btn:active { background: #FFD000; border-color: #FFD000; }
    .count-btn.minus:disabled { opacity: 0.3; cursor: not-allowed; }
    .count-btn.plus:disabled { opacity: 0.3; cursor: not-allowed; }
    .count-value {
      font-size: 20px;
      font-weight: 600;
      color: #333;
      min-width: 40px;
      text-align: center;
    }
    
    /* 费用计算 */
    .fee-section {
      background: #fff;
      margin: 12px;
      border-radius: 10px;
      padding: 16px;
    }
    .fee-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }
    .fee-label { font-size: 14px; color: #666; }
    .fee-value { font-size: 14px; color: #333; }
    .fee-total {
      border-top: 1px solid #f0f0f0;
      margin-top: 8px;
      padding-top: 12px;
    }
    .fee-total .fee-label { font-size: 15px; font-weight: 600; color: #333; }
    .fee-total .fee-value { font-size: 20px; font-weight: 700; color: #FF6B00; }
    
    /* 首次报名提示 */
    .first-time-tip {
      background: #FFF9E6;
      border: 1px solid #FFD000;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .first-time-tip svg { width: 18px; height: 18px; color: #F0A000; flex-shrink: 0; margin-top: 2px; }
    .first-time-tip-text { font-size: 12px; color: #996600; line-height: 1.5; }
    
    /* 底部按钮 */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 375px;
      background: #fff;
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0));
      border-top: 1px solid #f0f0f0;
    }
    .submit-btn {
      width: 100%;
      height: 48px;
      background: #FFD000;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      transition: all 0.2s;
    }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled {
      background: #E8E8E8;
      color: #999;
      cursor: not-allowed;
    }
    
    /* 协议 */
    .agreement {
      text-align: center;
      font-size: 11px;
      color: #999;
      margin-top: 8px;
    }
    .agreement a { color: #4A90D9; text-decoration: none; }
  </style>
</head>
<body>
  <div class="page-container">
    <!-- 导航栏 -->
    <div class="nav-bar">
      <div class="nav-back" onclick="history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </div>
      <div class="nav-title">活动报名</div>
      <div class="nav-right"></div>
    </div>
    
    <!-- 活动摘要 -->
    <div class="activity-summary">
      <img src="https://picsum.photos/160/160?random=301" alt="活动封面">
      <div class="activity-info">
        <div class="activity-title">黄山日出两日游｜观云海赏奇松</div>
        <div class="activity-meta">
          2026年5月15日-16日<br>
          黄山风景区
        </div>
        <div class="activity-price">¥299/人</div>
      </div>
    </div>
    
    <!-- 报名表单 -->
    <div class="form-section">
      <div class="form-title">报名信息</div>
      
      <!-- 首次报名提示 -->
      <div class="first-time-tip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 16v-4"/>
          <path d="M12 8h.01"/>
        </svg>
        <div class="first-time-tip-text">
          首次报名需完善个人信息，之后将自动填充
        </div>
      </div>
      
      <!-- 个人信息（首次填写） -->
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 姓名</div>
        <input type="text" class="form-input" placeholder="请输入真实姓名">
      </div>
      
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 手机号</div>
        <input type="tel" class="form-input" placeholder="请输入手机号">
      </div>
      
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 所属单位</div>
        <input type="text" class="form-input" placeholder="如：合肥工业大学">
      </div>
      
      <div class="form-group">
        <div class="form-label">身份证号 <span style="color:#999;font-size:12px;">(选填，用于购买保险)</span></div>
        <input type="text" class="form-input" placeholder="请输入身份证号">
      </div>
      
      <!-- 报名信息 -->
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 报名人数</div>
        <div class="count-selector">
          <button class="count-btn minus" onclick="changeCount(-1)">−</button>
          <span class="count-value" id="count">1</span>
          <button class="count-btn plus" onclick="changeCount(1)">+</button>
        </div>
      </div>
      
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 出发方式</div>
        <div class="transport-options">
          <div class="transport-option active" onclick="selectTransport(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
              <circle cx="7" cy="17" r="2"/>
              <circle cx="17" cy="17" r="2"/>
            </svg>
            跟车
          </div>
          <div class="transport-option" onclick="selectTransport(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
              <circle cx="7" cy="17" r="2"/>
              <circle cx="17" cy="17" r="2"/>
            </svg>
            自驾
          </div>
          <div class="transport-option" onclick="selectTransport(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 6v6l4 2"/>
            </svg>
            自行前往
          </div>
        </div>
      </div>
      
      <div class="form-group" style="margin-bottom:0;">
        <div class="form-label">备注</div>
        <textarea class="form-input form-textarea" placeholder="如有特殊需求请备注说明"></textarea>
      </div>
    </div>
    
    <!-- 费用计算 -->
    <div class="fee-section">
      <div class="fee-row">
        <span class="fee-label">预报名费</span>
        <span class="fee-value">¥299 × <span id="feeCount">1</span>人</span>
      </div>
      <div class="fee-row fee-total">
        <span class="fee-label">合计</span>
        <span class="fee-value" id="totalFee">¥299</span>
      </div>
    </div>
    
    <!-- 底部按钮 -->
    <div class="bottom-bar">
      <button class="submit-btn" onclick="submitForm()">确认报名并支付</button>
      <div class="agreement">
        报名即表示同意 <a href="#">《活动报名须知》</a>
      </div>
    </div>
  </div>
  
  <script>
    let count = 1;
    const price = 299;
    
    function changeCount(delta) {
      const newCount = count + delta;
      if (newCount >= 1 && newCount <= 5) {
        count = newCount;
        document.getElementById('count').textContent = count;
        document.getElementById('feeCount').textContent = count;
        document.getElementById('totalFee').textContent = '¥' + (price * count);
        
        // 更新按钮状态
        document.querySelector('.count-btn.minus').disabled = count <= 1;
        document.querySelector('.count-btn.plus').disabled = count >= 5;
      }
    }
    
    function selectTransport(el) {
      document.querySelectorAll('.transport-option').forEach(opt => opt.classList.remove('active'));
      el.classList.add('active');
    }
    
    function submitForm() {
      alert('报名成功！请加入活动群获取最新通知。');
      window.location.href = 'index.html';
    }
    
    // 初始化按钮状态
    document.querySelector('.count-btn.minus').disabled = true;
  </script>
</body>
</html>
